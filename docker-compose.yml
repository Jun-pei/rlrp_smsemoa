services:
  # Short end-to-end check that the image works (~2 min).
  smoke:
    build: .
    volumes:
      - ./results:/app/results
    command: >
      python rlrp_smsemoa/run_full_experiment.py
      --problems dtlz2 imop3
      --n_seeds 3
      --t_max 1000
      --mu 30
      --outdir /app/results/smoke

  # Full protocol of Sec. 5.3: 14 problems (DTLZ/WFG + all eight IMOP)
  # x 4 methods x 30 seeds.  Leaves 2 cores free.
  full:
    build: .
    volumes:
      - ./results:/app/results
    stdin_open: true
    tty: true
    command: >
      bash -c '
      CORES=$$(python -c "import os; print(max(1, os.cpu_count() - 2))");
      echo "Allocating $$CORES processes.";
      python rlrp_smsemoa/run_full_experiment.py
      --problems all
      --n_seeds 30
      --t_max 100000
      --mu 100
      --processes $$CORES
      --outdir /app/results/full
      '

  # The irregular geometries on their own (IMOP1..IMOP8), reported separately
  # from the regular ones as Sec. 6.1 requires.
  imop:
    build: .
    volumes:
      - ./results:/app/results
    command: >
      bash -c '
      CORES=$$(python -c "import os; print(max(1, os.cpu_count() - 2))");
      python rlrp_smsemoa/run_full_experiment.py
      --problems imop
      --n_seeds 30
      --t_max 100000
      --mu 100
      --processes $$CORES
      --outdir /app/results/imop
      '

  # Validation of every IGD+ reference set.
  check_reference_sets:
    build: .
    command: python rlrp_smsemoa/tests_reference_sets.py
